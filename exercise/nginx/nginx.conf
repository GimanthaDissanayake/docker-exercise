upstream service1 {
    server service1_1:8199;
    server service1_2:8199;
    server service1_3:8199;
}

server {
    listen 8198;

    resolver 127.0.0.11 valid=5s;
    
    include /etc/nginx/mime.types;

    auth_basic "Restricted Access";
    auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        proxy_pass http://service1/;
    }

    location /request {
        # Handle the request when the user clicks "REQUEST"
        proxy_pass http://service1/;
    }

    location /stop {
        # Handle stop button (stop the container)
        access_log /dev/null;
        error_log /dev/null;
        # exec /bin/sh -c "docker-compose down && exit";
    }
}